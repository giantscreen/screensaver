<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Workspace - Interactive Study Module</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fce4ec;
      user-select: none;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 20px;
    }
    .hud-element {
      background: rgba(255, 255, 255, 0.85);
      padding: 10px 20px;
      border-radius: 20px;
      border: 2px solid #f48fb1;
      color: #880e4f;
      font-weight: bold;
      font-size: 18px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    #hud-top {
      display: flex;
      justify-content: space-between;
    }
    #center-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 240, 245, 0.95);
      border: 3px solid #f06292;
      border-radius: 25px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      pointer-events: auto;
    }
    h1 {
      color: #ad1457;
      margin-top: 0;
    }
    p {
      color: #4a148c;
      font-size: 16px;
    }
    button {
      background: #ec407a;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    button:hover {
      background: #d81b60;
      transform: scale(1.05);
    }
    .hidden {
      display: none !important;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-layer">
    <div id="hud-top">
      <div class="hud-element" id="score-display">Hearts: 0</div>
      <div class="hud-element" id="energy-display">Energy: 100%</div>
    </div>
  </div>

  <div id="center-card">
    <h1 id="card-title">Study Session Start</h1>
    <p id="card-desc">Press Space to Flap/Jump, A/D or Left/Right to Swap Lanes.<br>Press Left Click or Enter to release Energy Pulses!</p>
    <button id="start-btn" onclick="initializeSession()">Begin</button>
  </div>

  <script>
    let scene, camera, renderer;
    let avatar, lanePositions = [-2.5, 0, 2.5], currentLane = 1;
    let velocityY = 0, gravity = -0.015, flapImpulse = 0.28;
    let obstacles = [], energyPulses = [], bonusItems = [];
    let score = 0, energy = 100, activeSession = false;
    let clock = new THREE.Clock();

    function initializeSession() {
      document.getElementById('center-card').classList.add('hidden');
      if (!scene) initScene();
      resetState();
      activeSession = true;
    }

    function initScene() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xfce4ec);
      scene.fog = new THREE.FogExp2(0xfce4ec, 0.015);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 4, 10);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffb74d, 0.8);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Path Plane
      const trackGeo = new THREE.PlaneGeometry(10, 1000);
      const trackMat = new THREE.MeshToonMaterial({ color: #f8bbd0 });
      const track = new THREE.Mesh(trackGeo, trackMat);
      track.rotation.x = -Math.PI / 2;
      track.position.z = -450;
      scene.add(track);

      // Avatar Construction
      const avatarGroup = new THREE.Group();
      const bodyGeo = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
      const bodyMat = new THREE.MeshToonMaterial({ color: 0xba68c8 });
      const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
      bodyMesh.position.y = 1;
      avatarGroup.add(bodyMesh);

      avatar = avatarGroup;
      avatar.position.set(lanePositions[currentLane], 0, 0);
      scene.add(avatar);

      // Event Listeners
      window.addEventListener('keydown', handleInput);
      window.addEventListener('mousedown', emitPulse);
      window.addEventListener('resize', handleResize);

      animate();
    }

    function resetState() {
      score = 0;
      energy = 100;
      currentLane = 1;
      velocityY = 0;
      avatar.position.set(lanePositions[currentLane], 0, 0);
      
      obstacles.forEach(o => scene.remove(o.mesh));
      energyPulses.forEach(p => scene.remove(p.mesh));
      bonusItems.forEach(b => scene.remove(b.mesh));
      
      obstacles = [];
      energyPulses = [];
      bonusItems = [];

      updateHUD();
    }

    function handleInput(e) {
      if (!activeSession) return;

      if ((e.key === 'a' || e.key === 'ArrowLeft') && currentLane > 0) {
        currentLane--;
      } else if ((e.key === 'd' || e.key === 'ArrowRight') && currentLane < 2) {
        currentLane++;
      } else if (e.key === ' ' || e.key === 'W' || e.key === 'w' || e.key === 'ArrowUp') {
        velocityY = flapImpulse; // Flappy Bird Mechanic
      } else if (e.key === 'Enter') {
        emitPulse();
      }
    }

    function emitPulse() {
      if (!activeSession || energy < 10) return;
      energy -= 10;
      updateHUD();

      const pulseGeo = new THREE.SphereGeometry(0.3, 16, 16);
      const pulseMat = new THREE.MeshBasicMaterial({ color: 0xffeb3b });
      const pulseMesh = new THREE.Mesh(pulseGeo, pulseMat);
      pulseMesh.position.set(avatar.position.x, avatar.position.y + 1, avatar.position.z - 0.5);
      
      scene.add(pulseMesh);
      energyPulses.push({ mesh: pulseMesh });
    }

    function spawnElements() {
      if (Math.random() < 0.03) {
        // Spawn Obstacle
        const geo = new THREE.BoxGeometry(1, 1.5, 1);
        const mat = new THREE.MeshToonMaterial({ color: 0xef5350 });
        const mesh = new THREE.Mesh(geo, mat);
        const targetLane = lanePositions[Math.floor(Math.random() * 3)];
        const targetY = Math.random() > 0.5 ? 0.75 : 2.5; // High or Low obstacle
        mesh.position.set(targetLane, targetY, -100);
        scene.add(mesh);
        obstacles.push({ mesh: mesh });
      }

      if (Math.random() < 0.02) {
        // Spawn Collectible
        const geo = new THREE.OctahedronGeometry(0.4);
        const mat = new THREE.MeshToonMaterial({ color: 0xab47bc });
        const mesh = new THREE.Mesh(geo, mat);
        const targetLane = lanePositions[Math.floor(Math.random() * 3)];
        mesh.position.set(targetLane, 1.5, -100);
        scene.add(mesh);
        bonusItems.push({ mesh: mesh });
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      if (activeSession) {
        // Gravity & Flap Physics
        velocityY += gravity;
        avatar.position.y += velocityY;
        if (avatar.position.y < 0) {
          avatar.position.y = 0;
          velocityY = 0;
        }

        // Horizontal Lane Interpolation
        avatar.position.x += (lanePositions[currentLane] - avatar.position.x) * 0.2;

        // Camera Follow
        camera.position.x = avatar.position.x * 0.3;
        camera.position.y = avatar.position.y + 3.5;

        // Energy Regeneration
        if (energy < 100) {
          energy = Math.min(100, energy + 0.05);
          updateHUD();
        }

        spawnElements();

        // Process Pulses
        for (let i = energyPulses.length - 1; i >= 0; i--) {
          const pulse = energyPulses[i];
          pulse.mesh.position.z -= 1.2;

          // Pulse vs Obstacle collision
          for (let j = obstacles.length - 1; j >= 0; j--) {
            const obs = obstacles[j];
            if (pulse.mesh.position.distanceTo(obs.mesh.position) < 1.2) {
              scene.remove(obs.mesh);
              scene.remove(pulse.mesh);
              obstacles.splice(j, 1);
              energyPulses.splice(i, 1);
              score += 25;
              updateHUD();
              break;
            }
          }

          if (pulse && pulse.mesh.position.z < -120) {
            scene.remove(pulse.mesh);
            energyPulses.splice(i, 1);
          }
        }

        // Process Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.mesh.position.z += 0.6;

          // Player Collision Check
          if (obs.mesh.position.distanceTo(avatar.position) < 1.1) {
            endSession();
          }

          if (obs.mesh.position.z > 10) {
            scene.remove(obs.mesh);
            obstacles.splice(i, 1);
            score += 10;
            updateHUD();
          }
        }

        // Process Collectibles
        for (let i = bonusItems.length - 1; i >= 0; i--) {
          const item = bonusItems[i];
          item.mesh.position.z += 0.6;
          item.mesh.rotation.y += 0.05;

          if (item.mesh.position.distanceTo(avatar.position) < 1.2) {
            scene.remove(item.mesh);
            bonusItems.splice(i, 1);
            score += 50;
            updateHUD();
          } else if (item.mesh.position.z > 10) {
            scene.remove(item.mesh);
            bonusItems.splice(i, 1);
          }
        }
      }

      renderer.render(scene, camera);
    }

    function updateHUD() {
      document.getElementById('score-display').innerText = `Hearts: ${score}`;
      document.getElementById('energy-display').innerText = `Energy: ${Math.floor(energy)}%`;
    }

    function endSession() {
      activeSession = false;
      document.getElementById('card-title').innerText = "Session Complete";
      document.getElementById('card-desc').innerText = `Final Score: ${score} Hearts`;
      document.getElementById('start-btn').innerText = "Try Again";
      document.getElementById('center-card').classList.remove('hidden');
    }

    function handleResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
